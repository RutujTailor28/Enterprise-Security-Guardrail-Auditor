AWSTemplateFormatVersion: '2010-09-09'
Description: Insecure IAM policy with wildcard permissions.

Resources:
  AdminPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: admin-wildcard-cfn-insecure
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: '*'
            Resource: '*'
