AWSTemplateFormatVersion: '2010-09-09'
Description: Insecure security group with SSH open to the internet.

Resources:
  OpenSshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH open to the world
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
