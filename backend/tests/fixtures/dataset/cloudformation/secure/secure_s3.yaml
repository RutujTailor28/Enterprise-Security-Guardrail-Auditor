AWSTemplateFormatVersion: '2010-09-09'
Description: Secure S3 bucket with encryption, versioning, logging, and public access block.

Resources:
  SecureDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: company-secure-data-cfn
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: company-audit-logs-cfn
        LogFilePrefix: secure-data/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
