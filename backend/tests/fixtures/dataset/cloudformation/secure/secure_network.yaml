AWSTemplateFormatVersion: '2010-09-09'
Description: Secure network — HTTPS ingress limited to private CIDR.

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from application subnet only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.10.0.0/16

  ReadOnlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: app-read-only
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - arn:aws:s3:::company-app-data
              - arn:aws:s3:::company-app-data/*
